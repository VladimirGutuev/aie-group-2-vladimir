service:
  host: 0.0.0.0
  port: 8000

ocr:
  engine: crnn          # "crnn" (trained) or "easyocr" (baseline)
  crnn_weights: artifacts/crnn.pt
  langs: [en, ru]       # used only when engine=easyocr
  min_confidence: 0.3

detector:
  enabled: false
  weights: yolov8n.pt
  imgsz: 640
  conf_threshold: 0.25

logging:
  level: INFO
